version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reservahub-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reservahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/test_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql

  api:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: reservahub-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reservahub
      JWT_SECRET: super_secret_reservahub_jwt_key_2026_safe
      CORS_ORIGIN: "*"
    depends_on:
      - postgres

volumes:
  postgres_data:
